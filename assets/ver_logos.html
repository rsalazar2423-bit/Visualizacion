<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Identidad Corporativa EcoGrid Colombia (Nativa Claro / Oscuro)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      padding: 40px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      gap: 32px;
      background: #E2E8F0;
      align-items: center;
    }
    .panel {
      border-radius: 24px;
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.12);
      transition: transform 0.2s ease;
    }
    .panel-light {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      color: #0F172A;
    }
    .panel-dark {
      background: #091928;
      border: 1px solid #1E2D3D;
      color: #F8FAFC;
    }
    h2 {
      margin-bottom: 8px;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    p {
      margin-bottom: 28px;
      font-size: 0.85rem;
      opacity: 0.75;
    }
    img {
      max-width: 380px;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="panel panel-light">
    <h2>1. VERSIÓN TEMA CLARO</h2>
    <p>Renderizado nativo con iluminación y tipografía en verde petróleo</p>
    <img src="/assets/logo_light.png" alt="EcoGrid Tema Claro">
  </div>
  <div class="panel panel-dark">
    <h2>2. VERSIÓN TEMA OSCURO</h2>
    <p>Renderizado nativo bioluminiscente con tipografía en blanco puro</p>
    <img src="/assets/logo_dark.png" alt="EcoGrid Tema Oscuro">
  </div>
</body>
</html>
