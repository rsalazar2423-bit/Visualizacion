<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra 3D profunda y resplandor -->
    <filter id="geo-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#022C22" flood-opacity="0.55"/>
    </filter>
    <filter id="pin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradientes Capas del Mapa Isométrico -->
    <linearGradient id="map-plane" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <linearGradient id="map-edge-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <linearGradient id="map-edge-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Gradiente Pin 3D (Esmeralda & Oro) -->
    <linearGradient id="pin-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <radialGradient id="radar-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#geo-shadow)">
    <!-- Base de Grosor del Plano Isométrico -->
    <polygon points="16,74 60,94 60,102 16,82" fill="url(#map-edge-left)"/>
    <polygon points="60,94 104,74 104,82 60,102" fill="url(#map-edge-right)"/>

    <!-- Superficie del Plano Territorial Isométrico -->
    <polygon points="60,54 104,74 60,94 16,74" fill="url(#map-plane)" stroke="#34D399" stroke-width="1.5"/>

    <!-- Curvas de nivel topográficas / Red de Transmisión -->
    <path d="M30,68 Q60,78 90,68" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.7"/>
    <path d="M40,62 Q60,70 80,62" stroke="#A7F3D0" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Ondas de radar concéntricas en el suelo -->
    <ellipse cx="60" cy="74" rx="24" ry="11" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8"/>
    <ellipse cx="60" cy="74" rx="14" ry="6" fill="url(#radar-pulse)"/>

    <!-- PIN 3D FLOTANTE (Con sombra propia) -->
    <!-- Sombra del Pin en el suelo -->
    <ellipse cx="60" cy="75" rx="6" ry="3" fill="#022C22" opacity="0.7"/>

    <!-- Cuerpo del Pin 3D en gota invertida -->
    <g filter="url(#pin-glow)">
      <!-- Sombra 3D lateral del pin -->
      <path d="M60,68 C53,52 46,42 46,32 C46,21 52,14 60,14 C68,14 74,21 74,32 C74,42 67,52 60,68 Z" 
            fill="url(#pin-body)"/>

      <!-- Brillo especular 3D cara frontal -->
      <path d="M60,16 C54,16 50,21 50,30 C50,38 55,48 60,62 C57,48 54,36 54,30 C54,23 57,17 60,16 Z" 
            fill="#FEF08A" opacity="0.85"/>

      <!-- Núcleo brillante interno (Esfera de Cristal 3D) -->
      <circle cx="60" cy="30" r="6" fill="#064E3B" stroke="#FEF08A" stroke-width="1.5"/>
      <circle cx="60" cy="30" r="3.5" fill="#10B981"/>
      <circle cx="58.5" cy="28.5" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
