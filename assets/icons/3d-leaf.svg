<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y profundidad 3D -->
    <filter id="shadow-3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#05261F" flood-opacity="0.45"/>
    </filter>
    <filter id="glow-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradientes 3D Hoja -->
    <linearGradient id="leaf-grad-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="leaf-grad-shadow-half" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="leaf-highlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#34D399" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vein-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <radialGradient id="base-pod" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05261F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aura o halo de base -->
  <ellipse cx="60" cy="100" rx="36" ry="12" fill="url(#base-pod)" />

  <!-- Grupo 3D con elevación -->
  <g filter="url(#shadow-3d)">
    <!-- Mitad Derecha (Sombra y volumen trasero) -->
    <path d="M60,18 C78,28 98,48 94,76 C91,96 74,103 60,105 C60,78 60,45 60,18 Z" 
          fill="url(#leaf-grad-shadow-half)" />

    <!-- Mitad Izquierda (Cuerpo principal iluminado) -->
    <path d="M60,18 C42,28 22,48 26,76 C29,96 46,103 60,105 C60,78 60,45 60,18 Z" 
          fill="url(#leaf-grad-body)" />

    <!-- Bisel de brillo especular superior (Efecto Vidrio/Gota 3D) -->
    <path d="M60,20 C46,30 30,48 33,70 C42,50 54,34 60,20 Z" 
          fill="url(#leaf-highlight)" />

    <!-- Nervadura Central 3D Oro Solar / Energía -->
    <path d="M60,22 Q60,65 58,104" 
          stroke="url(#vein-gold)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow-3d)" />

    <!-- Ramificaciones bio-tecnológicas -->
    <path d="M59,45 Q46,40 38,44" stroke="url(#vein-gold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M60,60 Q72,55 82,59" stroke="url(#vein-gold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M59,75 Q48,72 42,78" stroke="url(#vein-gold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M60,88 Q70,84 76,90" stroke="url(#vein-gold)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Nodo central de energía (Punto de luz) -->
    <circle cx="59.5" cy="60" r="3.5" fill="#FFFBEB" filter="url(#glow-3d)"/>
    <circle cx="59.5" cy="60" r="2" fill="#F59E0B"/>
  </g>
</svg>
