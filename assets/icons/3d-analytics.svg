<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Sombras volumétricas 3D -->
    <filter id="bar-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#042F2E" flood-opacity="0.5"/>
    </filter>
    <filter id="data-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradientes Columna 1 (Esmeralda) -->
    <linearGradient id="c1-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="c1-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="c1-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <!-- Gradientes Columna 2 (Cian Eléctrico) -->
    <linearGradient id="c2-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="c2-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#155E75"/>
    </linearGradient>
    <linearGradient id="c2-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Gradientes Columna 3 (Oro / Alta Potencia) -->
    <linearGradient id="c3-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="c3-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="c3-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Pedestal Isométrico -->
    <linearGradient id="pedestal-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Base Isométrica 3D -->
  <g filter="url(#bar-shadow)">
    <!-- Base Rombo Isométrico -->
    <polygon points="60,82 104,102 60,118 16,102" fill="url(#pedestal-top)" stroke="#475569" stroke-width="1.5" />
    <polygon points="16,102 60,118 60,122 16,106" fill="#0F172A" />
    <polygon points="60,118 104,102 104,106 60,122" fill="#020617" />

    <!-- Barra 1: Esmeralda (Izquierda, Media: H=40) -->
    <!-- Cara Frontal -->
    <polygon points="26,68 42,76 42,98 26,90" fill="url(#c1-front)"/>
    <!-- Cara Lateral -->
    <polygon points="42,76 52,70 52,92 42,98" fill="url(#c1-side)"/>
    <!-- Tapa Superior 3D -->
    <polygon points="26,68 36,62 52,70 42,76" fill="url(#c1-top)"/>

    <!-- Barra 2: Cian Tecnológico (Centro, Alta: H=60) -->
    <!-- Cara Frontal -->
    <polygon points="50,46 66,54 66,94 50,86" fill="url(#c2-front)"/>
    <!-- Cara Lateral -->
    <polygon points="66,54 76,48 76,88 66,94" fill="url(#c2-side)"/>
    <!-- Tapa Superior 3D -->
    <polygon points="50,46 60,40 76,48 66,54" fill="url(#c2-top)"/>

    <!-- Barra 3: Oro Solar (Derecha, Máxima: H=75) -->
    <!-- Cara Frontal -->
    <polygon points="74,28 90,36 90,88 74,80" fill="url(#c3-front)"/>
    <!-- Cara Lateral -->
    <polygon points="90,36 100,30 100,82 90,88" fill="url(#c3-side)"/>
    <!-- Tapa Superior 3D -->
    <polygon points="74,28 84,22 100,30 90,36" fill="url(#c3-top)"/>

    <!-- Línea de Tendencia Ascendente 3D Neón -->
    <path d="M36,60 L60,38 L84,20" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#data-glow)"/>
    
    <!-- Puntos Nodos de la línea -->
    <circle cx="36" cy="60" r="3.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="60" cy="38" r="3.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="84" cy="20" r="4.5" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2" filter="url(#data-glow)"/>
  </g>
</svg>
